# nginx inside a site's container (modules/deployments): the built frontend, with /api/ to the backend on
# 127.0.0.1:8000 (its API_PORT, see the boilerplate's backend/.env.prod.tmpl). Listens on 8080, the port the
# container publishes (SITE_INTERNAL_PORT). Runs as the container's unprivileged user, so it writes to /tmp only.
worker_processes 1;
daemon off;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    sendfile on;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    client_max_body_size 20m;

    server {
        listen 8080;
        root /app/frontend/dist;

        # The host's nginx already set the client's address and scheme: pass them on as they came.
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        # Vite's hashed bundles never change under one name: cached for good.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Everything else is the SPA: the file if there is one, else index.html (a client-side route).
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri /index.html;
        }
    }
}
